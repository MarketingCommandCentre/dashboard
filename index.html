<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/msa_logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/msa_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002855" />
    <meta
      name="description"
      content="UTM MSA Marketing Command Centre — requests, kanban, calendar, analytics and workload for the marketing team."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSA Marketing" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Marketing Command Centre</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #002855;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
      }
      #splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        animation: pulse-logo 1.6s ease-in-out infinite;
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/msa_logo_white.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
